name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Flutter project and inject code
        run: |
          flutter create split_easy_app
          cp main.dart split_easy_app/lib/main.dart
          cd split_easy_app
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitIT-APK
          path: split_it_app/build/app/outputs/flutter-apk/app-release.apk
